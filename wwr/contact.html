<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dry Oar Rafting Company "Contact Us"</title>
    <meta name="description" content="Whitewater Rafting information">
    <meta name="author" content="Alma Delia Barraza Raygoza">
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <div class="flexbox-container">
            <img src="images/logo.png" alt="logo">
            <nav>
                <ul class="navigation">
            
                    <li  class="flexbox-item"><a href="index.html">home</a></li>
                    <li  class="flexbox-item"><a href="about.html">about us</a></li>
                    <li  class="flexbox-item"><a href="trips.html">trips</a></li>
                    <li  class="flexbox-item"><a href="contact.html">contact us</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h1>Contact Us</h1>

        <h2 id="contacth2">Send us a message</h2>

        <p class="contactp">Silver City, New Mexico</p>
        <p class="contactp">Phone: 812-345-6789</p>
        <p class="contactp">Email: <a href="mailto:">dryoar@rafting.com</a></p>

        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d53675.64153142538!2d-108.33935753202407!3d32.77296187172585!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1ssanta%20catalina%20New%20mexico!5e0!3m2!1sen!2smx!4v1729381102978!5m2!1sen!2smx"
             width="500" height="350" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        </div>

        <section class="section-images" id="aligne">
            <h2 class="flexbox-h2">Part of our team!</h2>
            <figure class="flexbox-images">
                <img src="images/empleyee1.webp" alt="employee profile 1">
            <figcaption>Marthin Marshall</figcaption>
            </figure>
            
            <figure class="flexbox-images">
            <img src="images/employee2.webp" alt="employee profile 2">
            <figcaption>Brian Raynolds</figcaption> 
            </figure>

            <figure class="flexbox-images">
            <img src="images/employee3.webp" alt="employee profile 3">
            <figcaption>Amy Nash</figcaption>
            </figure>
        </section>

        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div>
                    <label for="full_name">Full Name:</label> 
                    <input type="text" id="full_name" name="full_name">
                </div>
                <div>
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail">
                </div>               
            </fieldset>

            <fieldset>
                <legend>Purpose of the message</legend>
                <input type="radio" id="general_inquiry" name="Purpose" value="general_inquiry">
                <label for="general_inquiry">General Inquiry</label><br>
                <input type="radio" id="reservation_question" name="Purpose" value="reservation_question">
                <label for="reservation_question">Reservation Question</label><br>
                <input type="radio" id="Website_suggestion" name="Purpose" value="Website_suggestion">
                <label for="Website_suggestion">Website Suggestion</label><br><br>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="10" placeholder="Please write your message here..."></textarea>
            </fieldset>

            <label for="subscription">Please subscribe me to the monthly newslatter
                <input type="checkbox" id="subscription" name="subscription" value="subscribe">
            </label>
            
            <button type="submit">Submit</button>
        </form>
        
    </main>
    <footer>
        <p>© 2024 Dry Oar Rafting co. | Alma Delia Barraza Raygoza</p>
        <nav class="sociallinks">
            <a href="https://app.moqups.com/sW2K3pDvfLWg59ZjykOCxCGCghKxckhA/view/page/ad64222d5">Contact us Wireframe</a>
            <a href="https://www.facebook.com">
                <img src="images/facebook.webp" alt="Facebook">
            </a>
            <a href="https://twitter.com">
                <img src="images/Twitter.webp" alt="Twitter">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.webp" alt="Instagram">
            </a>
            
        </nav>    
    </footer>
    
</body>
</html>
